<svg viewBox="0 0 980 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00b8d9"/>
    </marker>
  </defs>
  <rect width="980" height="260" fill="#0d1117"/>

  <!-- Step 1 -->
  <rect x="20" y="90" width="140" height="80" rx="10" fill="#161b22" stroke="#00ff88" stroke-width="2"/>
  <text x="90" y="120" fill="#f0f0f0" font-size="14" text-anchor="middle" font-weight="bold">emails.txt</text>
  <text x="90" y="140" fill="#8b949e" font-size="11" text-anchor="middle">one email</text>
  <text x="90" y="154" fill="#8b949e" font-size="11" text-anchor="middle">per line</text>

  <line x1="160" y1="130" x2="205" y2="130" stroke="#00b8d9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="210" y="90" width="150" height="80" rx="10" fill="#161b22" stroke="#00ffff" stroke-width="2"/>
  <text x="285" y="120" fill="#f0f0f0" font-size="14" text-anchor="middle" font-weight="bold">Extract domain</text>
  <text x="285" y="140" fill="#8b949e" font-size="11" text-anchor="middle">user@domain.com</text>
  <text x="285" y="154" fill="#8b949e" font-size="11" text-anchor="middle">→ domain.com</text>

  <line x1="360" y1="130" x2="405" y2="130" stroke="#00b8d9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="410" y="90" width="150" height="80" rx="10" fill="#161b22" stroke="#ffff00" stroke-width="2"/>
  <text x="485" y="118" fill="#f0f0f0" font-size="14" text-anchor="middle" font-weight="bold">DNS lookup</text>
  <text x="485" y="138" fill="#8b949e" font-size="11" text-anchor="middle">A record via</text>
  <text x="485" y="152" fill="#8b949e" font-size="11" text-anchor="middle">dns.resolver</text>
  <text x="485" y="166" fill="#ffbe0b" font-size="10" text-anchor="middle">cached per-domain</text>

  <line x1="560" y1="130" x2="605" y2="130" stroke="#00b8d9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="610" y="90" width="150" height="80" rx="10" fill="#161b22" stroke="#ff00ff" stroke-width="2"/>
  <text x="685" y="118" fill="#f0f0f0" font-size="14" text-anchor="middle" font-weight="bold">Geolocate IP</text>
  <text x="685" y="138" fill="#8b949e" font-size="11" text-anchor="middle">GET api.country.is</text>
  <text x="685" y="152" fill="#8b949e" font-size="11" text-anchor="middle">→ ISO country code</text>

  <line x1="760" y1="130" x2="805" y2="130" stroke="#00b8d9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="810" y="90" width="150" height="80" rx="10" fill="#161b22" stroke="#00ff41" stroke-width="2"/>
  <text x="885" y="118" fill="#f0f0f0" font-size="14" text-anchor="middle" font-weight="bold">Write output</text>
  <text x="885" y="138" fill="#8b949e" font-size="11" text-anchor="middle">CODE_Country.txt</text>
  <text x="885" y="152" fill="#8b949e" font-size="11" text-anchor="middle">+ _summary.txt</text>

  <!-- Thread pool annotation -->
  <rect x="210" y="200" width="550" height="40" rx="8" fill="none" stroke="#ff8800" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="485" y="225" fill="#ff8800" font-size="12" text-anchor="middle">Steps above run concurrently across a ThreadPoolExecutor (default 8 threads, 500-email chunks)</text>

  <text x="490" y="30" fill="#00ffff" font-size="16" text-anchor="middle" font-weight="bold">Email → Domain → DNS → IP → Country → File</text>
</svg>
